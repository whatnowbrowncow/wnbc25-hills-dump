                  "mac": "00:22:BD:F8:19:FF",
                  "ifInstT": "ext-svi",
                  "encap": "vlan-{{ item.svi_vlan }}",
                  "tDn": "topology/pod-1/protpaths-{{ item.svi_nodes }}/pathep-[{{ item.svi_path }}]",
                  "rn": "rspathL3OutAtt-[topology/pod-1/protpaths-{{ item.svi_nodes }}/pathep-[{{ item.svi_path }}]]",
                  "status": "created,modified"
                },
                "children": [
                  {
                    "l3extMember": {
                      "attributes": {
                        "side": "A",
                        "addr": "{{ item.svi_side_a }}/{{ item.svi_cidr }}",
                        "llAddr": "0.0.0.0",
                        "status": "created,modified"
                      },
                      "children": [
                        {
                          "l3extIp": {
                            "attributes": {
                              "addr": "{{ item.svi_shared }}/{{ item.svi_cidr }}",
                              "status": "created,modified"
                            },
                          }
                        }
                      ]
                    }
                  },
                  {
                    "l3extMember": {
                      "attributes": {
                        "side": "B",
                        "addr": "{{ item.svi_side_b }}/{{ item.svi_cidr }}",
                        "llAddr": "0.0.0.0",
                        "status": "created,modified"
                      },
                      "children": [
                        {
                          "l3extIp": {
                            "attributes": {
                              "addr": "{{ item.svi_shared }}/{{ item.svi_cidr }}",
                              "status": "created,modified"
                            },
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      }
    validate_certs: no
  with_items:
    - "{{ node_profiles }}"
  when: item.bgp is not defined

- name: Move to Select Nodes
  include_tasks: ./aci-fatl3out-select-nodes.yml
