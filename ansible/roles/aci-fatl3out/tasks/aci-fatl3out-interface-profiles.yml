- name: Create Logical Interface Profiles that do NOT use BGP (fatl3out task 4)
  aci_rest:
    hostname: '{{ ansible_host }}'
    username: '{{ aci_user }}'
    private_key: '{{ aci_key }}'
    method: post
    path: "/api/node/mo/uni/tn-{{ item.tenant }}/out-{{ item.fatl3out }}/lnodep-{{ item.np }}_np/lifp-{{ item.np }}_intprof.json"
    content:
      {
        "l3extLIfP": { ## Creates the parent Logical Interface Profile
          "attributes": {
            "dn": "uni/tn-{{ item.tenant }}/out-{{ item.fatl3out }}/lnodep-{{ item.np }}_np/lifp-{{ item.np }}_intprof",
            "name": "{{ item.np }}_intprof",
            "rn": "lifp-{{ item.np }}_intprof",
