---
- name: Creating Timestamp
  ansible.builtin.set_fact:
    timestamp: "{{ time }}"
  check_mode: false

- name: ASA-RAS - Creating a changes directory for ACL configuration 'diff' files
  ansible.builtin.file:
    path: "{{ changes_dir }}"
    state: directory
  check_mode: false

# Retrieves current RAS ACLs and Group Policy Infomation
- name: ASA-RAS - Retrieving the pre-change ACL configuration
  cisco.asa.asa_command:
    commands:
      - show running-config access-list
      - show running-config group-policy
  register: activeACL
  check_mode: false
  vars:
    ansible_command_timeout: 1000
    ansible_connect_timeout: 200

#  Places infomation gathered in the task above into a temporary file for used in comparison
- name: ASA-RAS - Taking a snapshot of the pre_change ACL configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/backup-template.j2"
    dest: "{{ pre_conf_file }}"
  changed_when: false
  check_mode: false
