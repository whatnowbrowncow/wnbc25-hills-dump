---

- name: Create geolocation object for the site - (1/6).
  aci_rest:
    hostname: "{{ ansible_host }}"
    username: "{{ aci_user }}"
    private_key: "{{ aci_key }}"
    method: post
    path: "/api/node/mo/uni/fabric/site-{{ geo_site }}.json"
    content:
      {
        "geoSite": {
          "attributes": {
            "dn": "uni/fabric/site-{{ geo_site }}",
            "name": "{{ geo_site }}",
            "rn": "site-{{ geo_site }}",
            "status": "created,modified"
          },
          "children": []
        }
      }
    validate_certs: no

- name: Create geolocation object for site building - (2/6).
  aci_rest:
    hostname: "{{ ansible_host }}"
    username: "{{ aci_user }}"
    private_key: "{{ aci_key }}"
    method: post
    path: "/api/node/mo/uni/fabric/site-{{ geo_site }}/building-{{ geo_building }}.json"
    content:
