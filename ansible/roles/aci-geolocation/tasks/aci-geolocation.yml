- name: Create geolocation objects for each row of racks - (5/6).
  aci_rest:
    hostname: "{{ ansible_host }}"
    username: "{{ aci_user }}"
    private_key: "{{ aci_key }}"
    method: post
    path: "/api/node/mo/uni/fabric/site-{{ geo_site }}/building-{{ geo_building }}/floor-{{ geo_floor }}/room-{{ geo_room }}/row-{{ item.0.row }}.json"
    content:
      {
        "geoRow": {
          "attributes": {
            "dn": "uni/fabric/site-{{ geo_site }}/building-{{ geo_building }}/floor-{{ geo_floor }}/room-{{ geo_room }}/row-{{ item.0.row }}",
            "name": "{{ item.0.row }}",
            "rn": "row-{{ item.0.row }}",
            "status": "created,modified"
          },
          "children": []
        }
      }      
    validate_certs: no
  with_subelements: 
    - "{{ geo_rows }}"
    - racks

