- name: Add syslog host config to {{ contexts_item.context }} using known routed interface
  asa_config:
    lines:
      - "logging host {{ item.stdout_lines.0.4.split().4 }} {{ item.item }}"
    context: "{{ contexts_item.context }}"
  when: item.stdout_lines.0.1 != '% Subnet not in table'    
  with_items:
    - "{{ reg_syslog_route_output.results }}"
  ignore_errors: True
