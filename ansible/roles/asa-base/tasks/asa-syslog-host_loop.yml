- name: Add syslog host config to {{ contexts_item.context }} using default route interface
  asa_config:
    lines:
      - "logging host {{ reg_output.stdout_lines.0.10.split(',').1.strip() }} {{ item.item }}"
    context: "{{ contexts_item.context }}"
  when: item.stdout_lines.0.1 == '% Subnet not in table'    
  with_items:
    - "{{ reg_syslog_route_output.results }}"
    
    
