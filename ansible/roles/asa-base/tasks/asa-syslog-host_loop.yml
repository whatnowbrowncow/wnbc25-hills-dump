#      - "{{ reg_output }}"
  
    
- name: Collect route for syslog servers on {{ contexts_item.context }}
  asa_command:
    commands:
      - "show route {{ item }}"
    context: "{{ contexts_item.context }}" 
  register: reg_syslog_route_output
  with_items:
    - "{{ syslog_svrs }}"


