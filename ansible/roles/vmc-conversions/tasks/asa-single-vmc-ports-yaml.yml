## Confirm Directory Exisits
- name: ASA-SINGLE - Create directory for YAML files if not present
  file:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    state: directory

## Following task places the details in the SDDC groups yml file 
- name: ASA-SINGLE - Generate VMC YAML file - Service Objects (groups)
  template:
    src: /gitnet/ansible/roles/vmc-conversions/templates/asa_single/dfw_sddc_specific_ports_yaml.j2
    dest: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/dfw_sddc_specific_ports.yml"

## Convert ASA 'named' ports to 'numbered' ports for VMC
- name: ASA-SINGLE - Convert ASA named ports to numbered ports
  command: "./asa2vmc-port-converter.py -i {{ inventory_dir }}/host_vars/{{ inventory_hostname }}/dfw_sddc_specific_ports.yml"
  args:
    chdir: "{{ role_path }}/files"

## Refresh dfw_sddc_specific_groups variables in order to generate .tf file in the next task
- name: Refreshing dfw_sddc_specific_groups variables generated by the above tasks in order to service any subsequent tasks
  include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/dfw_sddc_specific_ports.yml"
