## Collect all ACLs from ASA
- name: ASA-SINGLE - Collecting the ACL configuration
  asa_command:
    commands:
      - "show running-config | include access-list"
      - "show running-config | include access-group"
  register: acl_output

## Collect all services from ASA
- name: ASA-SINGLE - collect service objects info
  asa_command:
    commands:
      - show run object service in-line
  register: asa_single_service_objects

## Collect all service groups from the ASA
- name: ASA-SINGLE - collect network info
  asa_command:
    commands:
      - show run object-group service
  register: asa_single_service_object_groups

## Collect all protocol groups from the ASA
- name: ASA-SINGLE - collect protocol object-group info
  asa_command:
    commands:
      - show run object-group protocol
  register: asa_single_protocol_object_groups

