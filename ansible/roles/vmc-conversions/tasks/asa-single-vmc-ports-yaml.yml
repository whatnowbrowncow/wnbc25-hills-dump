## Parse the access-group configuration
- name: ASA-SINGLE - Parsing the access-group configuration
  command_parser:
    file: "/gitnet/ansible/parser_templates/asa_single/parser_asa_single_acl_access_groups.yml"
    content: "{{ acl_output.stdout.1 }}"

## Collect the names of extended ACLs
- name: ASA-SINGLE - Collecting the names of extended ACLs
  set_fact:
    ext_acls: "{{ acl_output.stdout[0] | regex_findall('^access-list +(?!global_mpc)(\\S+) +extended','\\g<#ext_acls>') | unique }}"

## Collect the configuration lines of each extended ACL
- name: ASA-SINGLE - Collecting the configuration lines of each extended ACL
  asa_command:
    commands:
      - "show access-list {{ item }} | exclude ^ "
  loop: "{{ ext_acls }}"
  loop_control:
    label: "Collecting the configuration of access-list {{ item }}"
  register: rules

## Parse the extended ACL configuration
- name: ASA-SINGLE - Parsing the extended ACL configuration
  command_parser:
    file: /gitnet/ansible/parser_templates/asa_single/parser_asa_single_acl_extended.yml
    content: "{{ item.stdout.0 }}"
  loop: "{{ rules.results }}"
  loop_control:
    label: "Parsing the configuration of access-list {{ item.item }}"
  register: extended_access_lists

## Collectthe names of standard ACLs
- name: ASA-SINGLE - Collecting the names of standard ACLs
  set_fact:
    std_acls: "{{ acl_output.stdout[0] | regex_findall('^access-list +(\\S+) +standard','\\g<std_acls>') | unique }}"

## Collect the configuration lines of each standard ACL
- name: ASA-SINGLE - Collecting the configuration lines of each standard ACL
  asa_command:
    commands:
      - "show access-list {{ item }} | exclude ^ "
  loop: "{{ std_acls }}"
  loop_control:
    label: "Collecting the configuration of access-list {{ item }}"
  register: rules

## Parse the standard ACL configuration
- name: ASA-SINGLE - Parsing the standard ACL configuration
  command_parser:
    file: /gitnet/ansible/parser_templates/asa_single/parser_asa_single_acl_standard.yml
    content: "{{ item.stdout.0 }}"
  loop: "{{ rules.results }}"
  loop_control:
    label: "Parsing the configuration of access-list {{ item.item }}"
  register: standard_access_lists

## join the ACLs into a single list for YAML templating
- name: ASA-SINGLE - Joining the ACLs (extended | standard) for YAML templating
  set_fact:
    access_lists: "{{ extended_access_lists.results + standard_access_lists.results }}"

## Parse the service data from above and place in to a relevent object fact
- name: ASA-SINGLE - parse command output - service objects
  command_parser:
    file: /gitnet/ansible/parser_templates/asa_single/parser_asa_single_objects_service.yml
    content: "{{ asa_single_service_objects.stdout.0 }}"

## Parse the service group names out
- name: ASA-SINGLE - parse command output - service groups split
  command_parser:
    file: /gitnet/ansible/parser_templates/asa_multiple/parser_asa_multiple_object_groups_service_split.yml
    content: "{{ asa_single_service_object_groups.stdout.0 }}"

## Parse out details within the group, mearge with group name and place in relevent object fact
- name: ASA-SINGLE - Parsing the service object-group configuration
  command_parser:
    file: /gitnet/ansible/parser_templates/asa_single/parser_asa_single_object_groups_service.yml
    content: "{{ item.service_objects.0 }}"
  loop: "{{ service_objects_groups }}"
  loop_control:
    label: "Parsing the configuration of service object-group {{ item.name.matches.0 }}"
  register: service_obj_groups

