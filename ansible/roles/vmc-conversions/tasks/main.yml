---

- name: Import network parser role
  include_role:
    name: ansible-network.network-engine

## ASA-MULTIPLE ########################################################################

## all files at once ##

- name: ASA-MULTIPLE - groups, ports and rules creation task.
  include_tasks: ./asa-multiple-vmc-all-yaml.yml
  with_items:
    - "{{ contexts }}"
  loop_control:
    loop_var: context
  when: ansible_network_os == "asa" and context_mode == "multiple"

- name: ASA-MULTIPLE - groups, ports and rules VMC Terraform creation task.
  include_tasks: ./asa-multiple-vmc-all-tf.yml
  with_items:
    - "{{ contexts }}"
  loop_control:
    loop_var: context
  when: ansible_network_os == "asa" and context_mode == "multiple"

