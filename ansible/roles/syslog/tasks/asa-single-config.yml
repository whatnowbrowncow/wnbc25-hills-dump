#        - "For syslog server {{ item.syslog_svr_ip_addr[0] }} {{inventory_hostname}} will use interface {{ item.interface }}"
#      when: item.interface == ""
#      loop: "{{ syslog_interfaces }}"
#
#    - name: Display syslog interface data 
#      debug:
#        msg: 
#        - "For syslog server {{ item.syslog_svr_ip_addr[0] }} {{inventory_hostname}} will use the default route interface {{ default_interface }}"
#      when: item.interface != ""
#      loop: "{{ syslog_interfaces }}"

# calling a jinja2 template to produce syslog configuration lines to use as the desired configuration for comparison
- name: ASA-SINGLE - Constructing (for application) the updated syslog configuration
  set_fact:
    syslogconfig: "{{ lookup('template', 'templates/asa_single/config-template.j2')|from_yaml }}"

# configuration task that compares the active and desired configurations and adds any missing entries, this will only run when a valid route is available for the IP
- name: ASA-SINGLE - Applying the updated syslog configuration
  asa_config:
    lines: "{{ syslogconfig[0].lines }}"
    match: line
    config: "{{ activelogging }}"
  register: loggingUPDATE
  changed_when: "loggingUPDATE.updates is defined"
  notify: "asa single updates exist"
  when: syslog_svr.interface[0] is defined or (syslog_svr.interface[0] is not defined and default_interface[0] is defined)

# Identify if any contexts do not run because valid routing does not exist
- name: Notify any skipped contexts
  debug:
    msg: 
    - "Configuration has been skipped because no routing has been defined so syslog configuration is not possible"
  when: syslog_svr.interface[0] is not defined and syslog_svr.interface[0] is not defined and default_interface[0] is not defined

# final task that saves the running configuration if any changes were registered in the configuration task above
#- name: ASA-SINGLE - Saving the configuration (when changed)
#  asa_config:
#    save: yes
#  when: 'loggingUPDATE.changed'

- name: Flush handlers to force log creation before moving onto the next role
  meta: flush_handlers