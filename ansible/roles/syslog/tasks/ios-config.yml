---

- name: Apply syslog settings not visible in running config
  ios_config:
    lines:
      - logging on
    defaults: yes

- name: IOS - Build configuration for testing purposes
  template:
    src: /gitnet/ansible/roles/syslog/templates/ios/config-template.j2
    dest: /gitnet/ansible/roles/syslog/files/configs/ios/{{ inventory_hostname }}.cfg

- name: IOS - Apply configuration
  ios_config:
    src: /gitnet/ansible/roles/syslog/templates/ios/config-template.j2