# calling a jinja2 template to produce syslog configuration lines to use as the desired configuration for comparison
- name: ASA-MULTIPLE - Constructing (for application) the updated syslog configuration
  set_fact:
    syslogconfig: "{{ lookup('template', 'templates/asa_multiple/config-template.j2')|from_yaml }}"

# configuration task that compares the active and desired configurations and adds any missing entries, this will only run when a valid route is available for the IP
- name: ASA-MULTIPLE - Applying the updated syslog configuration
  asa_config:
    lines: "{{ syslogconfig[0].lines }}"
    match: line
    config: "{{ activelogging }}"
  register: loggingUPDATE
  changed_when: "loggingUPDATE.updates is defined"
  notify: "asa multiple updates exist"
  when: contexts.context == "admin" or syslog_interfaces[0].interface is defined or (syslog_interfaces[0].interface is not defined and default_interface[0] is defined)

# Identify if any contexts do not run because valid routing does not exist
- name: Notify any skipped contexts
  debug:
    msg: 
    - "Context {{ contexts.context }} has been skipped because no routing has been defined so syslog configuration is not possible"
  when: contexts.context != "admin" and syslog_interfaces[0].interface is not defined and default_interface[0] is not defined

# final task that saves the running configuration if any changes were registered in the configuration task above
#- name: ASA-MULTIPLE - Saving the configuration (when changed)
#  asa_config:
#    save: yes
#  when: 'loggingUPDATE.changed'

# finally create a current_context variable to include in the logs and fluch handlers to kick of the log creation on each loop (context)  
- name: ASA-MULTIPLE - set context fact to allow log labelling
  set_fact:
    current_context: "{{ contexts.context }}"

- name: Flush handlers to force log creation before moving onto the next role
  meta: flush_handlers