---

- name: Registering if file exists
  stat:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/config-dataset.yml"
  register: filecheck

- name: Ending the play for hosts with no config-dataset.yml host_var file
  meta: end_host
  when: not filecheck.stat.exists

- name: Refreshing final-state variables generated by the report task
  include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/config-dataset.yml"

- name: IOS - Config interface descriptions
  ios_config:
    before: 
      - interface {{ item.interface }}
    lines: 
      - description {{ item.interface_description }}
    save_when: "changed"
  with_items:
    - "{{ final_state }}"
  when: final_state is defined 

- name: IOS - Cleaning Staging file - Deleting config-data file
  file:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/config-dataset.yml"
    state: absent