---

contracts:
  - contract: "ob-web-2_to_ob-app-2"
    description: "Test contract"
    provider:
      provider: "ob-app-2"
      app_prof: "ant-test-1_appprof"
    consumer: 
      consumer: "ob-web-2"
      app_prof: "ant-test-1_appprof"
    tenant: "ant-tenant"
    scope: "tenant"
    subjects:
      - subject: "fabric_routed"
        description: "fabric routed subject"
        filters:
          - filter: "fab-filter"
            log: "log"
            entries:
              - entry: "Web"
                protocol: "tcp"
                dst_port_start: "80"
                stateful: "yes"
              - entry: "My_app"
                dst_port_start: "15000"
                dst_port_end: "15010"
                stateful: "yes"
      - subject: "firewall_routed"
        description: "Firewall routed subject"
        filters:
          - filter: "fw-filter"
            log: "log"
            entries:
              - entry: "Web"
                protocol: "tcp"
                dst_port_start: "80"
                stateful: "yes"
              - entry: "My_app"
                dst_port_start: "15000"
                dst_port_end: "15010"
                stateful: "yes"
