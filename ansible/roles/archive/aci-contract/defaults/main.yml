              - entry: "My_app"
                dst_port_start: "15000"
                dst_port_end: "15010"
                stateful: "yes"
  - contract: "ob-app_to_ob-db"
    description: "Test ob-app to ob-db access"
    provider:
      provider: "ob-db"
      app_prof: "ant-test-1_appprof"
    consumer: 
      consumer: "ob-app"
      app_prof: "ant-test-1_appprof"
    tenant: "ant-tenant"
    scope: "tenant"
    subjects:
      - subject: "firewall_routed"
        description: "Firewalled access"
        filters:
          - filter: "db_access"
            log: "log"
            entries:
              - entry: "db"
                protocol: "tcp"
                dst_port_start: "3106"
                stateful: "yes"
              - entry: "alt-db"
                dst_port_start: "15000"
                dst_port_end: "15010"
                stateful: "yes"
  - contract: "jumphost_to_ob-db"
    description: "Test jumphost to ob-db access"
    provider:
