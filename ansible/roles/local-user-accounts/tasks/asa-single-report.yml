---

- name: ASA SINGLE - collect local user account info
  asa_command:
    commands:
      - show run | i username
  register: asa_single_local_accounts_output

- name: ASA SINGLE - parse command output
  command_parser:
    file: "{{ role_path }}/files/parser_templates/parser_asa_single_local_user_accounts.yml"
    content: "{{ asa_single_local_accounts_output.stdout.0 }}"

- name: ASA SINGLE - Generate csv report
  template:
    src: "{{ role_path }}/templates/asa_single/csv-template.j2"
    dest: "{{ role_path }}/files/csv/asa_single/{{ inventory_hostname }}.csv"