---

- name: ASA MULTIPLE - collect local user account info
  asa_command:
    commands:
      - show run | i username
  register: asa_multiple_local_accounts_output

- name: ASA MULTIPLE - parse command output
  command_parser:
    file: "{{ role_path }}/files/parser_templates/parser_asa_multiple_local_user_accounts.yml"
    content: "{{ asa_multiple_local_accounts_output.stdout.0 }}"

- name: ASA MULTIPLE - Generate csv report
  template:
    src: "{{ role_path }}/templates/asa_multiple/csv-template.j2"
    dest: "{{ role_path }}/files/csv/asa_multiple/{{ inventory_hostname }}.csv"