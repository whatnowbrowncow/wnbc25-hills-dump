- name: IOSXR - Generate csv report
  template:
    src: /gitnet/ansible/roles/mgmt_int/templates/iosxr/csv-template.j2
    dest: /gitnet/ansible/roles/mgmt_int/files/csv/iosxr/{{ inventory_hostname }}.csv