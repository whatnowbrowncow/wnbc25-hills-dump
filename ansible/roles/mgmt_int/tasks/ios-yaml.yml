---

- name: IOS - Check for a .129 mgmt IP address
# Targets the tacacs source interface as the assumed management interface
  ios_command:
    commands:
      - show ip int brief | include [0-9]+\.[0-9]+\.129\.[0-9]+
  register: mgmt129_int

- name: IOS - Register .129 interface as a variable
  set_fact:
    mgmt129_int: "{{ mgmt129_int.stdout[0] | regex_search('(?P<int>\\S+)','\\g<int>') }}"

- name: IOS - capture .129 interface config
# Targets the tacacs source interface as the assumed management interface
  ios_command:
    commands:
      - show run int {{ mgmt129_int[0] }}
  register: mgmt129_int_config
  when: mgmt129_int != ""
# Debug commands to check output
#- name: Display output
#  debug: var=mgmt_int

- name: IOS - parse .129 interface output
  command_parser:
    file: /gitnet/ansible/parser_templates/ios/parser_ios_mgmt129_int.yml
    content: "{{ mgmt129_int_config.stdout.0 }}"
  when: mgmt129_int != ""

# Debug commands to check output
#- name: Display JSON output
#  debug: var=mgmt129_int_facts

