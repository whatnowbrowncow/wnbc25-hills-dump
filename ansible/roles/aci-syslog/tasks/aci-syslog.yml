    hostname: '{{ ansible_host }}'
    username: '{{ aci_user }}'
    private_key: '{{ aci_key }}'
    method: post
    path: "/api/node/mo/uni/tn-common/monepg-default/slsrc-tenant-common-{{ item.group }}.json"
    content:
      {
        "syslogSrc": {
          "attributes": {
            "dn": "uni/tn-common/monepg-default/slsrc-tenant-common-{{ item.group }}",
            "name": "tenant-common-{{ item.group }}",
            "incl": "audit,events,faults,session",
            "minSev": "information",
            "rn": "slsrc-tenant-common-{{ item.group }}",
          },
          "children": [
