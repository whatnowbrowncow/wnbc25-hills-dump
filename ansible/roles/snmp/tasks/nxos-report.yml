---

- name: NX-OS - Collecting the SNMP configuration
  nxos_command:
    commands:
      - show snmp community
  register: raw_output

- name: NX-OS - Parsing the SNMP configuration
  command_parser:
    file: "/gitnet/ansible/parser_templates/nxos/parser_nxos_snmp.yml"
    content: "{{ raw_output.stdout.0 }}"

- name: NX-OS - Generating the CSV report
  template:
    src: "/gitnet/ansible/roles/snmp/templates/nxos/csv-template.j2"
    dest: "/gitnet/ansible/roles/snmp/files/csv/nxos/{{ inventory_hostname }}.csv"
