---

- name: IOS - Collecting the SNMP configuration
  ios_command:
    commands:
      - show run | i snmp
  register: raw_output

- name: IOS - Parsing the SNMP configuration
  command_parser:
    file: "/gitnet/ansible/parser_templates/ios/parser_ios_snmp.yml"
    content: "{{ raw_output.stdout.0 }}"

- name: IOS - Creating a host directory for YAML files (if not already present)
  file:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    state: directory

- name: IOS - Generating the YAML file
  template:
    src: "/gitnet/ansible/roles/snmp/templates/ios/yml-template.j2"
    dest: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/snmp.yml"
