---

tenants:
#  - tenant: "ant-tenant"
#    contexts:
#      - context: "ant-vrf"
  - tenant: "production"
    contexts:
      - context: "production"
      - context: "retail"
      - context: "corp"
      - context: "whc"
  - tenant: "common"
    contexts:
      - context: "internal-vrf"
      - context: "retail-vrf"
      - context: "sis-vrf"
      - context: "tote-vrf"
      - context: "cde-mgmt-vrf"

domains:
  network_devices:
    domain: "network-devices"
    domain_type: "phys"
  enclosures:
    domain: "enclosures"
    domain_type: "phys"
  vmware:
    domain: "vmware"
    domain_type: "vmm"

    
alt_domains:
  - domain: "network-devices"
    domain_type: "phys"
  - domain: "enclosures"
    domain_type: "phys"
  - domain: "vmware"
    domain_type: "vmm"

    
vmm_domain: "LD6LABDvSRES01"

pod_id: "1"

static_interfaces:
  - description: "Data connection to uk-ld6-pp-fw05 firewalls"
    connected_device: "firewall"
    aep: "network-devices"
    cdp_policy: "cdp-disabled"
    #The below variable (lag_type) sets this as a VPC
    lag_type: "node"
    link_level_policy: "10Gbps"
    lldp_policy: "lldp-disable"
    policy_group: "uk-ld6-fw05-data_polgrp"
    port_channel_policy: "lacp-active"
    leafs: "101,102"
    interfaces:
      - interface: "1/5"
        description: "Connection to primary firewall"
      - interface: "1/15"
        description: "Connection to secondary firewall"
  - description: "Connection to uk-ld6-labenc-01 module 1"
    connected_device: "enclosure"
    aep: "enclosures_attentp"
    cdp_policy: "cdp-disabled"
    #The below variable (lag_type) sets this as a VPC
    lag_type: "node"
    link_level_policy: "1Gbps"
    lldp_policy: "lldp-enabled"
    policy_group: "uk-ld6-labenc-01-mod1_polgrp"
    port_channel_policy: "lacp-active-nosuspend"
    leafs: "101,102"
    interfaces:
      - interface: "1/9"
        description: "Connection to module 1"
  - description: "Connection to uk-ld6-labenc-01 module 2"
    connected_device: "enclosure"
    aep: "enclosures_attentp"
    cdp_policy: "cdp-disabled"
    #The below variable (lag_type) sets this as a VPC
    lag_type: "node"
    link_level_policy: "1Gbps"
    lldp_policy: "lldp-enabled"
    policy_group: "uk-ld6-labenc-01-mod2_polgrp"
    port_channel_policy: "lacp-active-nosuspend"
    leafs: "101,102"
    interfaces:
      - interface: "1/10"
        description: "Connection to module 2" 
  - description: "Connection to uk-ld6-labenc-03 module 1"
    connected_device: "enclosure"
    aep: "enclosures_attentp"
    cdp_policy: "cdp-disabled"
    #The below variable (lag_type) sets this as a VPC
    lag_type: "node"
    link_level_policy: "10Gbps"
    lldp_policy: "lldp-enabled"
    policy_group: "uk-ld6-labenc-03-mod1_polgrp"
    port_channel_policy: "lacp-active-nosuspend"
    leafs: "101,102"
    interfaces:
      - interface: "1/40"
        description: "Connection to module 1"
  - description: "Connection to uk-ld6-labenc-03 module 2"
    connected_device: "enclosure"
    aep: "enclosures_attentp"
    cdp_policy: "cdp-disabled"
    #The below variable (lag_type) sets this as a VPC
    lag_type: "node"
    link_level_policy: "10Gbps"
    lldp_policy: "lldp-enabled"
    policy_group: "uk-ld6-labenc-03-mod2_polgrp"
    port_channel_policy: "lacp-active-nosuspend"
    leafs: "101,102"
    interfaces:
      - interface: "1/41"
        description: "Connection to module 2" 
 
