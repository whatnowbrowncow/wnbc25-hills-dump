---

  - name: PLAY - Static Bindings query
    hosts: aci
    connection: local
    gather_facts: no


    tasks:
    
    - name: Query Static Bindings
      aci_static_binding_to_epg:
        hostname: '{{ ansible_host }}'
        username: '{{ aci_user }}'
        private_key: '{{ aci_key }}'
        state: query
        interface_type: vpc
        leafs: "101,102"
        validate_certs: no
        
      register: imdata_static

      
    - debug:
        msg:
          - "{{ item }}"
      with_items:
        - "{{ imdata_static.current }}"

