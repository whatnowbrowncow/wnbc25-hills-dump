---

- name: parser meta data
  parser_metadata:
    version: 1.0
    command: "show running-config object-group service"
    network_os: asa

- name: service object-group match pattern
  pattern_match:
    regex: "^object-group service \\S+"
    match_all: yes
    match_greedy: yes
  register: section

- name: match service object-group values
  pattern_group:
    - name: match name
      pattern_match:
        regex: "^object-group service (\\S+)"
        content: "{{ item }}"
      register: name
    
    - name: service object-group match pattern
      pattern_match:
        regex: "(.*)"
        match_greedy: yes
        content: "{{ item }}"
      register: service_objects

  loop: "{{ section }}"
  export: yes
  register: service_objects_groups