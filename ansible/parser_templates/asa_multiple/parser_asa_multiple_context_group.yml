---

- name: parser meta data
  parser_metadata:
    version: 1.0
    command: "show run context | inc ^context|join-fail"
    network_os: asa

- name: contexts match pattern
  pattern_match:
    regex: "^context (\\S+)\\n  join-failover-group (\\d+)|^context (\\S+)"
    match_all: yes
    match_greedy: yes
    content: "{{ item }}"
  export: yes
  register: context_groups

- name: Match context values
  pattern_group:
    - name: match context
      pattern_match:
        regex: "^context (\\S+)"
        content: "{{ item  }}"
      register: context_name

    - name: match group
      pattern_match:
        regex: "^context \\S+\\n  join-failover-group (\\d+)"
        content: "{{ item }}"
      register: context_group 
  loop: "{{ context_groups }}"
  register: context_group_values   


- name: Generate JSON data structure
  json_template:
    template:
      - key: name
        value: "{{ item.context_name.matches.0 }}"
      - key: group
        value: "{{ item.context_group.matches.0 | default(1) }}"
  loop: "{{ context_group_values }}"
  export: yes
  register: asa_context_failover_group_facts