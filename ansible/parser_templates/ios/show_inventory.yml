---
- name: parser meta data
  parser_metadata:
    version: 1.0
    command: show inventory
    network_os: ios
                            
- name: match sections
  pattern_match:
    regex: "^NAME"
    match_all: yes
    match_greedy: yes
  register: section
                            
                            
- name: match inventory values
  pattern_group:
    - name: match name
      pattern_match:
        regex: "NAME: \"(.*?)\""
        content: "{{ item }}"
      register: name
                                           
    - name: match description
      pattern_match:
        regex: "DESCR: \"(.*?)\""
        content: "{{ item }}"
      register: descr
                                                                                                               
    - name: match pid
      pattern_match:
        regex: "PID: \"(\\S+)\"\\s"
        content: "{{ item }}"
      register: pid
                                                                                                                          
    - name: match vid
      pattern_match:
        regex: "VID: (\\S+),"
        content: "{{ item }}"
      register: vid 

    - name: match serial
      pattern_match:
        regex: "SN: (\\S+)"
        content: "{{ item }}"
      register: sn

  loop: "{{ section }}"
  register: inventory

- name: generate json data structure
  json_template:
    template:
      - key: inventory_item
        object:
          - key: name
            value: "{{ item.name.matches.0 }}"
          - key: descr
            value: "{{ item.descr.matches.0 }}"
          - key: pid
            value: "{{ item.pid.matches.0 }}"
          - key: vid
            value: "{{ item.vid.matches.0 }}"
          - key: sn
            value: "{{ item.sn.matches.0 }}"
  loop: "{{ inventory }}"
  ##use export to display to screen
  export: yes
  register: inventory_facts
