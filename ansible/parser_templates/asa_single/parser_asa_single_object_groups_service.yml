---

- name: parser meta data
  parser_metadata:
    version: 1.0
    command: "show run object-group service"
    network_os: asa

- name: service-object group_name match pattern
  pattern_match:
    regex: "^object-group service \\S+"
    match_all: yes
    match_greedy: yes
  register: group_name

- name: service-object object match pattern
  pattern_match:
    regex: "^ service-object object \\S+"
    match_all: yes
    match_greedy: yes
  register: service_object_objects

- name: service-object service match pattern
  pattern_match:
    regex: "^ service-object (tcp-udp|tcp|udp)"
    match_all: yes
    match_greedy: yes
  register: service_object_services

- name: port-object service match pattern
  pattern_match:
    regex: "^ port-object"
    match_all: yes
    match_greedy: yes
  register: service_port_objects

- name: service-object group-object match pattern
  pattern_match:
    regex: "^ group-object \\S+"
    match_all: yes
    match_greedy: yes
  register: service_object_group_objects

- name: description match pattern
  pattern_match:
    regex: "^ description .*\\n"
    match_all: yes
    match_greedy: yes
  register: group_description

- name: Match object-group name
  pattern_group:
    - name: match name
      pattern_match:
        regex: "^object-group service (\\S+)"
        content: "{{ item }}"
      register: name

    - name: match protocol
      pattern_match:
        regex: "^object-group service \\S+ (tcp-udp|tcp|udp)"
        content: "{{ item }}"
      register: protocol

  loop: "{{ group_name }}"
  register: object_group_name 

- name: Match object-group description
  pattern_group:
    - name: match name
      pattern_match:
        regex: "^ description (.*)\\n"
        content: "{{ item }}"
      register: description

  loop: "{{ group_description }}"
  register: group_description_value 

- name: Match service-object object values
  pattern_group:
    - name: match name
      pattern_match:
        regex: "^ service-object object (\\S+)"
        content: "{{ item }}"
      register: name

  loop: "{{ service_object_objects }}"
  register: service_object_objects_group    

- name: Match service-object services values
  pattern_group:

    - name: match protocol
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp)"
        content: "{{ item }}"
      register: protocol

    - name: match direction
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp) (source|destination)"
        content: "{{ item }}"
      register: direction

    - name: match port type
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp) (source|destination) (eq|range)"
        content: "{{ item }}"
      register: port_type

    - name: match port
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp) (source|destination) eq (\\S+)"
        content: "{{ item }}"
      register: port

    - name: match range_start
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp) (source|destination) range (\\S+)"
        content: "{{ item }}"
      register: range_start

    - name: match range_end
      pattern_match:
        regex: "^ service-object (tcp-udp|udp|tcp) (source|destination) range \\S+ (\\S+)"
        content: "{{ item }}"
      register: range_end

  loop: "{{ service_object_services }}"
  loop_control:
    label: "Checking Service Object {{ indexnum }}"
    index_var: indexnum
  register: service_object_services_group  


- name: Match service-object group-object values
  pattern_group:
    - name: match name
      pattern_match:
        regex: "^ group-object (\\S+)"
        content: "{{ item }}"
      register: name

    - name: match type
      pattern_match:
        regex: "^ (group)-object \\S+"
        content: "{{ item }}"
      register: type

  loop: "{{ service_object_group_objects }}"
  loop_control:
    label: "Checking Service Group Object {{ indexnum }}"
    index_var: indexnum
  register: service_object_group_objects_group   

- name: Match port-object values
  pattern_group:
    - name: match port_type
      pattern_match:
        regex: "^ port-object (eq|range)"
        content: "{{ item }}"
      register: port_type

    - name: match port
      pattern_match:
        regex: "^ port-object eq (\\S+)"
        content: "{{ item }}"
      register: port

    - name: match range_start
      pattern_match:
        regex: "^ port-object range (\\S+)"
        content: "{{ item }}"
      register: range_start

    - name: match range_end
      pattern_match:
        regex: "^ port-object range \\S+ (\\S+)"
        content: "{{ item }}"
      register: range_end

  loop: "{{ service_port_objects }}"
  loop_control:
    label: "Checking Port Object {{ indexnum }}"
    index_var: indexnum
  export: yes
  register: service_port_objects_group  


- name: Generate group name JSON data structure - 
  json_template:
    template:
      - key: name
        value: "{{ item.name.matches.0 }}"    
      - key: protocol
        value: "{{ item.protocol.matches.0 }}"      
  loop: "{{ object_group_name }}"
  loop_control:
    label: "Checking Object group {{ indexnum }}"
    index_var: indexnum
  export: yes
  register: object_group

- name: Generate group name JSON data structure - 
  json_template:
    template:
      - key: description
        value: "{{ item.description.matches.0 }}"       
  loop: "{{ group_description_value }}"
  export: yes
  register: object_group_description

- name: Generate group-object object JSON data structure - 
  json_template:
    template:       
      - key: object_name
        value: "{{ item.name.matches.0 }}"
  loop: "{{ service_object_objects_group }}"
  export: yes
  register: objects

- name: Generate group-object services JSON data structure - 
  json_template:
    template: 
          - key: protocol
            value: "{{ item.protocol.matches.0 }}"
          - key: direction
            value: "{{ item.direction.matches.1 }}"
          - key: port_type
            value: "{{ item.port_type.matches.2 }}"
          - key: port
            value: "{{ item.port.matches.2 }}"
          - key: range_start
            value: "{{ item.range_start.matches.2 }}"
          - key: range_end
            value: "{{ item.range_end.matches.2 }}"
  loop: "{{ service_object_services_group }}"
  export: yes
  register: services

- name: Generate port-object host JSON data structure - 
  json_template:
    template:       
          - key: port_type
            value: "{{ item.port_type.matches.0 }}"
          - key: port
            value: "{{ item.port.matches.0 }}"
          - key: range_start
            value: "{{ item.range_start.matches.0 }}"
          - key: range_end
            value: "{{ item.range_end.matches.0 }}"
  loop: "{{ service_port_objects_group }}"
  export: yes
  register: port_objects

- name: Generate group-object JSON data structure - 
  json_template:
    template:        
      - key: group_object_name
        value: "{{ item.name.matches.0 }}"
  loop: "{{ service_object_group_objects_group }}"
  export: yes
  register: group_objects