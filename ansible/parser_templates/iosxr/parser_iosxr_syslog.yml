---

- name: parser meta data
  parser_metadata:
    version: 1.0
    command: show run
    network_os: iosxr

- name: syslog servers match pattern
  pattern_match:
    regex: "^logging \\d+.\\d+.\\d+.\\d+"
    match_all: yes
    match_greedy: yes
  register: syslog_servers

- name: Match syslog server values
  pattern_group:
    - name: match syslog ip address
      pattern_match:
        regex: "^logging (\\d+.\\d+.\\d+.\\d+)"
        content: "{{ item }}"
      register: ip_address

    - name: match vrf
      pattern_match:
        regex: "^logging \\d+.\\d+.\\d+.\\d+ vrf (\\S+)"
        content: "{{ item }}"
      register: vrf 

  loop: "{{ syslog_servers }}"
  register: syslog_server_values    

- name: Generate JSON data structure
  json_template:
    template:
      - key: syslog_servers
        object:        
          - key: ip_address
            value: "{{ item.ip_address.matches.0 }}"
          - key: vrf
            value: "{{ item.vrf.matches.0 }}" 
  loop: "{{ syslog_server_values }}"
  export: yes
  register: syslog_server_facts

- name: match logging source
  pattern_match:
    regex: "^logging source-interface"
    match_all: yes
    match_greedy: yes
  register: syslog_source_interface

- name: Match logging source values
  pattern_group:
    - name: match logging source interface
      pattern_match:
        regex: "^logging source-interface (\\S+)"
        content: "{{ item }}"
      register: source_interface

    - name: match vrf
      pattern_match:
        regex: "^logging source-interface \\S+ vrf (\\S+)"
        content: "{{ item }}"
      register: vrf 

  loop: "{{ syslog_source_interface }}"
  register: syslog_source_interface_values    

- name: Generate JSON data structure
  json_template:
    template:
      - key: syslog_servers
        object:        
          - key: source_interface
            value: "{{ item.source_interface.matches.0 }}"
          - key: vrf
            value: "{{ item.vrf.matches.0 }}" 
  loop: "{{ syslog_source_interface_values }}"
  export: yes
  register: syslog_source_interface_facts