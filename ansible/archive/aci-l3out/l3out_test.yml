---

  - name: PLAY - L3out build
    hosts: aci
    connection: local
    gather_facts: no
    
  
    tasks:
    
      - name: build L3out template
        template:
          src: "./aci/l3out.j2"
          dest: "./aci/l3out_{{ item.context }}_fatl3out.json"
        with_items:
          - "{{ l3outs }}"
          
# Below used for testing          
#      - name: Output L3outs dict
#        debug:
#          msg: "The L3out name is: {{ item.context }}_fatl3out"
#        with_items:
#          - "{{ l3outs }}"
          
      - name: L3out build
        aci_rest:
          hostname: '{{ ansible_host }}'
          username: '{{ provider_cli.username }}'
          password: '{{ provider_cli.password }}'
          method: post
          path: "/api/node/mo/uni/tn-{{ item.tenant }}/out-{{ item.context }}_fatl3out.json"
          src: "./aci/l3out_{{ item.context }}_fatl3out.json"
          validate_certs: no
        with_items:
          - "{{ l3outs }}"
        #The below register grabs the contents of the returned imdata from the get request
        register: imdata_l3outs
        delegate_to: localhost

      - name: Confirm success or failure of configuration
        debug:
          msg: "{{item.error_text}}"
        with_items:
          - "{{imdata_l3outs.results}}"

