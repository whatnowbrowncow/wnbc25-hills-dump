      - name: Build L3 Node Profile template
        template:
          src: "./aci/l3extlogicalnodeprofile.j2"
          dest: "./aci/l3extlogicalnodeprofile_{{ item.0.context }}_{{ item.1.peer_device }}_np.json"
        with_subelements:
          - "{{ l3outs }}"
          - interface_profile
 
  
      - name: L3 Node Profile build
        aci_rest:
          hostname: '{{ ansible_host }}'
          username: '{{ provider_cli.username }}'
          password: '{{ provider_cli.password }}'
          method: post
          path: "/api/node/mo/uni/tn-{{ item.0.tenant }}/out-{{item.0.context}}_fatl3out/lnodep-{{ item.0.context }}_{{ item.1.peer_device }}_np.json"
          src: "./aci/l3extlogicalnodeprofile_{{ item.0.context }}_{{ item.1.peer_device }}_np.json"
          validate_certs: no
        with_subelements:
          - "{{ l3outs }}"
          - interface_profile
        #The below register grabs the contents of the returned imdata from the get request
        register: imdata_l3extlogicalnodeprofile
        delegate_to: localhost
        
      - name: Confirm success or failure of configuration
        debug: 
          msg: "{{item.error_text}}"
        with_items:
          - "{{imdata_l3extlogicalnodeprofile.results}}"
 
