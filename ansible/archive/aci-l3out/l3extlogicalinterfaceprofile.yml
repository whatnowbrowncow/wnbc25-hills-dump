---

  - name: PLAY - test Logical Interface build
    hosts: aci
    connection: local
    gather_facts: no
  
    tasks:

##Below used for testing          
#      - name: Output L3 Interface Profile dict
#        debug:
#          msg: "The L3 Interface Profile vpc switch is: {{ l3outs[0].interface_profile[0].svi.vpc_path.vpc_switches }}"
